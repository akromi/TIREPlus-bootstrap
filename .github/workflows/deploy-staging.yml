name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - staging
          - production

# Deploys must not overlap. Two merges 24 seconds apart put two of these on the
# wire at once, and with dangerous-clean-slate each one WIPES the web root before
# uploading — so one deploy deleted the directory tree the other was uploading
# into. The second died on "Server sent FIN packet unexpectedly" while creating
# a folder, and staging was left holding whichever run happened to finish last
# rather than the newest commit.
#
# One group covering the whole workflow, not one per target: staging and
# production use the same FTP account, so overlapping them risks the same
# collision even though the remote directories differ.
#
# cancel-in-progress is deliberately FALSE. Cancelling an FTP deploy mid-flight
# is the one outcome worse than queueing behind it — dangerous-clean-slate means
# the kill could land after the wipe and before the upload, leaving the site
# empty. A queued run waits instead; if another queues behind it, GitHub drops
# the older pending one, which is correct here since every run deploys main and
# the newest content supersedes it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build site
        run: node build.js
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./site/
          include-hidden-files: true

  deploy-staging:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ./site/
      - name: Select staging .htaccess
        run: |
          cp site/.htaccess.staging site/.htaccess
          rm site/.htaccess.staging site/.htaccess.production
      - name: Deploy to Staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.tireplus.ca
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_REMOTE }}
          dangerous-clean-slate: true

  deploy-production:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ./site/
      - name: Select production .htaccess
        run: |
          cp site/.htaccess.production site/.htaccess
          rm site/.htaccess.staging site/.htaccess.production
      - name: Deploy to Production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.tireplus.ca
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_REMOTE }}
          dangerous-clean-slate: true